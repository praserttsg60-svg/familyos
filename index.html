<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Family OS — ผู้ช่วยดูแลเรื่องสำคัญของครอบครัว</title>
<meta name="description" content="รวมเรื่องสำคัญของครอบครัวไว้ที่เดียว นัดหมอ วันเกิด เอกสารหมดอายุ ค่าใช้จ่าย พร้อมเตือนก่อนถึงกำหนด ข้อมูลเก็บในเครื่องคุณเท่านั้น ใช้ฟรี ไม่ต้องสมัคร">
<meta name="theme-color" content="#FF9A56">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Family OS">
<meta property="og:title" content="Family OS — ผู้ช่วยดูแลเรื่องสำคัญของครอบครัว">
<meta property="og:description" content="ไม่ลืมนัดหมอ วันเกิด เอกสารหมดอายุ ค่าใช้จ่าย — ข้อมูลอยู่ในเครื่องคุณเท่านั้น">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --cream:#FFF8F0; --cream2:#FFF3E6; --white:#FFFFFF;
 --orange:#FF9A56; --orange-d:#F07E33; --peach:#FFD5B8; --yellow:#FFC960;
 --green:#5FBF8A; --green-l:#E4F6EC; --brown:#8C6A4A; --brown-l:#C9A889;
 --ink:#3E2E23; --muted:#8B7566; --line:#F0E2D4;
 --red:#E0553F; --red-l:#FDEDEA; --blue:#5B93D6; --blue-l:#E8F1FB;
 --amber:#E89A2B; --amber-l:#FFF3DF;
 --sh:0 6px 22px rgba(140,106,74,.10);
 --sh2:0 14px 40px rgba(140,106,74,.16);
 --r:20px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{overscroll-behavior-y:none}
body{overscroll-behavior-y:none}
body{
 font-family:'Anuphan',system-ui,-apple-system,sans-serif;color:var(--ink);
 background:
  radial-gradient(900px 420px at 8% -6%,#FFE7D0 0%,transparent 62%),
  radial-gradient(820px 400px at 96% 2%,#FFF0D6 0%,transparent 60%),
  radial-gradient(760px 420px at 50% 104%,#E9F7EE 0%,transparent 58%),
  var(--cream);
 -webkit-font-smoothing:antialiased;
 padding-top:env(safe-area-inset-top);
 min-height:100vh;
}
h1,h2,h3,h4,.mitr{font-family:'Mitr','Noto Sans Thai',system-ui,sans-serif;font-weight:500}
/* ตัวเลขใช้ฟอนต์ระบบเสมอ กันเครื่องบางรุ่นเรนเดอร์เลขศูนย์เป็นสัญลักษณ์ */
.num{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
 font-weight:700;font-variant-numeric:tabular-nums;font-variant-emoji:text}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hide{display:none !important}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;padding:0 16px 108px;max-width:1180px;margin:0 auto;width:100%}
@media(min-width:960px){
 .app{gap:0}
 .side{display:flex;flex-direction:column;gap:6px;width:236px;flex-shrink:0;padding:22px 14px;
  background:rgba(255,255,255,.72);border-right:1px solid var(--line);position:sticky;top:0;height:100vh}
 .main{padding:0 28px 60px}
 .bottomnav{display:none !important}
}
.sidelogo{display:flex;align-items:center;gap:10px;margin-bottom:18px;padding:0 8px}
.sidelogo img{width:40px;height:40px;border-radius:12px}
.sidelogo b{font-family:'Mitr',sans-serif;font-size:17px;display:block;line-height:1.1}
.sidelogo small{font-size:11px;color:var(--muted)}
.navbtn{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:14px;font-size:14.5px;color:var(--muted);transition:.15s;text-align:left;width:100%}
.navbtn span.i{font-size:18px;width:22px;text-align:center}
.navbtn:hover{background:var(--cream2);color:var(--ink)}
.navbtn.on{background:linear-gradient(96deg,var(--orange),var(--yellow));color:#fff;font-weight:600;box-shadow:0 8px 20px rgba(255,154,86,.32)}

/* ---------- header ---------- */
.topbar{padding:22px 0 8px;display:flex;align-items:flex-start;gap:12px}
.topbar .grow{flex:1;min-width:0}
.hello{font-size:13px;color:var(--muted)}
.topbar h1{font-size:25px;line-height:1.2;margin-top:2px}
.icobtn{width:44px;height:44px;border-radius:14px;background:var(--white);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;font-size:19px;position:relative;flex-shrink:0}
.dotbadge{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid #fff}

.avatars{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 4px}
.av{width:48px;border-radius:16px;text-align:center;padding:7px 3px 6px;background:var(--white);box-shadow:var(--sh);transition:.15s}
.av:hover{transform:translateY(-2px)}
.av .em{font-size:20px;line-height:1}
.av .nm{font-size:10px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av.add{border:2px dashed var(--peach);background:transparent;box-shadow:none;color:var(--orange)}

/* ---------- cards ---------- */
.sec{margin-top:26px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sec-h h2{font-size:16px}
.sec-h button{font-size:13px;color:var(--orange);font-weight:600}
.card{background:var(--white);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.grid4{grid-template-columns:repeat(4,1fr)}}
.stat{border-radius:18px;padding:14px;box-shadow:var(--sh);transition:.15s;text-align:left}
.stat:active{transform:scale(.98)}
.stat .em{font-size:19px}
.stat .n{font-size:26px;line-height:1.1;margin-top:5px}
.stat .l{font-size:11.5px;opacity:.85;margin-top:1px}
.s-ok{background:var(--green-l);color:#2C7A52}
.s-warn{background:var(--amber-l);color:#9A6208}
.s-due{background:var(--red-l);color:#B23A26}
.s-love{background:#FFEDF2;color:#B8436B}

.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
@media(min-width:560px){.qa{grid-template-columns:repeat(4,1fr)}}
.qbtn{background:var(--white);border-radius:16px;padding:13px 10px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px;align-items:flex-start;transition:.15s}
.qbtn:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.qbtn .em{font-size:20px}
.qbtn .t{font-size:12.5px;font-weight:600;line-height:1.3}

/* ---------- item rows ---------- */
.itemlist{display:flex;flex-direction:column;gap:9px}
.item{background:var(--white);border-radius:17px;padding:13px 14px;box-shadow:var(--sh);display:flex;gap:11px;align-items:flex-start;position:relative;overflow:hidden;transition:.15s}
.item:hover{box-shadow:var(--sh2)}
.item .bar{position:absolute;left:0;top:0;bottom:0;width:5px}
.item .em{font-size:19px;flex-shrink:0;margin-left:3px}
.item .body{flex:1;min-width:0}
.item .ti{font-size:14.5px;font-weight:600;line-height:1.35}
.item.done .ti{text-decoration:line-through;opacity:.5}
.item .me{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.5}
.item .right{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pill{font-size:10.5px;padding:3px 9px;border-radius:99px;font-weight:600;white-space:nowrap}
.p-today{background:var(--red-l);color:var(--red)}
.p-tmr{background:var(--amber-l);color:var(--amber)}
.p-7{background:#FFF0E4;color:#D97B2E}
.p-30{background:var(--blue-l);color:var(--blue)}
.p-over{background:#EEE9E4;color:#6D5B4E}
.p-ok{background:var(--green-l);color:#2C7A52}
.chk{width:30px;height:30px;border-radius:10px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent;flex-shrink:0;background:#fff;transition:.15s}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:10.5px;background:var(--cream2);color:var(--muted);padding:2px 8px;border-radius:99px}

.empty{text-align:center;padding:30px 18px;color:var(--muted);font-size:13.5px;line-height:1.7}
.empty .em{font-size:34px;display:block;margin-bottom:8px}

/* ---------- calendar ---------- */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calhead b{font-family:'Mitr',sans-serif;font-size:16px}
.calnav{width:36px;height:36px;border-radius:12px;background:var(--cream2);display:flex;align-items:center;justify-content:center;font-size:16px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cdow{text-align:center;font-size:11px;color:var(--muted);padding:4px 0;font-weight:600}
.cday{aspect-ratio:1;font-variant-emoji:text;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13.5px;background:var(--cream2);transition:.15s;position:relative}
.cday.out{opacity:.32}
.cday.today{outline:2px solid var(--orange);font-weight:700}
.cday.sel{background:linear-gradient(140deg,var(--orange),var(--yellow));color:#fff;font-weight:700}
.cday .dots{display:flex;gap:2.5px}
.cday i{width:5px;height:5px;border-radius:50%;display:block}

/* ---------- finance ---------- */
.fin3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.fin{border-radius:17px;padding:13px;box-shadow:var(--sh);background:var(--white)}
.fin .l{font-size:11px;color:var(--muted)}
.fin .v{font-size:17px;margin-top:3px}

/* ---------- forms / modal ---------- */
.modal{position:fixed;inset:0;background:rgba(62,46,35,.5);z-index:80;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.sheet{background:var(--white);border-radius:26px 26px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:8px 18px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media(min-width:600px){.modal{align-items:center;padding:24px}.sheet{border-radius:24px;animation:none}}
.grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:8px auto 14px}
.sheet h3{font-size:18px;margin-bottom:4px}
.sheet .sub{font-size:12.5px;color:var(--muted);margin-bottom:16px;line-height:1.6}
.f{margin-bottom:13px}
.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
.f input,.f select,.f textarea{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:15px;background:#FFFDFA}
.f textarea{min-height:76px;resize:vertical;line-height:1.6}
.f input:focus,.f select:focus,.f textarea:focus{outline:0;border-color:var(--orange);background:#fff}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:9px 13px;border-radius:99px;background:var(--cream2);font-size:13px;transition:.15s;border:2px solid transparent}
.chip.on{background:linear-gradient(96deg,var(--orange),var(--yellow));color:#fff;font-weight:600}
.chip.sm{padding:7px 12px;font-size:12.5px}
.btn{width:100%;padding:15px;border-radius:17px;font-family:'Mitr',sans-serif;font-size:15.5px;
 background:linear-gradient(96deg,var(--orange),var(--yellow));color:#fff;box-shadow:0 10px 24px rgba(255,154,86,.34);transition:.15s}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--cream2);color:var(--muted);box-shadow:none}
.btn.danger{background:var(--red-l);color:var(--red);box-shadow:none}
.btn.sm{padding:11px;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.note{font-size:12px;color:#8A6B2E;background:#FFF6E6;border-radius:14px;padding:12px 14px;line-height:1.7;margin-top:12px}
.note.warn{color:#B23A26;background:var(--red-l)}
.note.safe{color:#2C7A52;background:var(--green-l)}

/* ---------- bottom nav ---------- */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:space-around;
 background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);
 padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;border-radius:14px;color:var(--muted);font-size:10.5px}
.bn .i{font-size:19px}
.bn.on{color:var(--orange);font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:61;width:58px;height:58px;border-radius:20px;
 background:linear-gradient(140deg,var(--orange),var(--yellow));color:#fff;font-size:28px;line-height:1;
 box-shadow:0 12px 30px rgba(255,154,86,.45);display:flex;align-items:center;justify-content:center}
@media(min-width:960px){.fab{bottom:28px;right:28px}}

/* ---------- toast / in-app notify ---------- */
.toastwrap{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:99;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--white);border-radius:16px;padding:13px 15px;box-shadow:var(--sh2);display:flex;gap:11px;align-items:flex-start;
 animation:down .25s ease;max-width:520px;margin:0 auto;width:100%;pointer-events:auto}
@keyframes down{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
.toast .em{font-size:19px}
.toast b{display:block;font-size:13.5px;font-family:'Mitr',sans-serif;font-weight:500}
.toast small{font-size:12px;color:var(--muted);line-height:1.5}

.lock{position:fixed;inset:0;background:var(--cream);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
.lock img{width:74px;height:74px;border-radius:22px;box-shadow:var(--sh2)}
.pinrow{display:flex;gap:9px}
.pindot{width:15px;height:15px;border-radius:50%;background:var(--line)}
.pindot.on{background:var(--orange)}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:11px;margin-top:6px}
.key{height:60px;border-radius:19px;background:var(--white);box-shadow:var(--sh);font-family:'Mitr',sans-serif;font-size:21px}
</style>
</head>
<body>

<div class="toastwrap" id="toasts"></div>

<div class="app">
 <aside class="side" id="side"></aside>
 <main class="main" id="main"></main>
</div>

<button class="fab" id="fab" aria-label="เพิ่มรายการ">＋</button>
<nav class="bottomnav" id="bnav"></nav>
<div id="modalRoot"></div>
<div id="lockRoot"></div>

<script>
/* ══════════════════════════════════════════
   Family OS — ข้อมูลทั้งหมดเก็บในเครื่องผู้ใช้
   ══════════════════════════════════════════ */
const KEY='familyos:v1';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];

/* ---------- วันที่ ---------- */
const pad=n=>String(n).padStart(2,'0');
const toISO=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>toISO(new Date());
const parseD=s=>{const[a,b,c]=(s||'').split('-').map(Number);return new Date(a,(b||1)-1,c||1);};
const diffDays=(iso)=>{
 if(!iso)return null;
 const a=parseD(today()),b=parseD(iso);
 return Math.round((b-a)/86400000);
};
const TH_M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_MFULL=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_DOW=['อา','จ','อ','พ','พฤ','ศ','ส'];
const fmtD=iso=>{if(!iso)return '';const d=parseD(iso);return `${d.getDate()} ${TH_M[d.getMonth()]} ${d.getFullYear()+543}`;};
const money=n=>Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:2});

/* ---------- หมวดหมู่ ---------- */
const CATS={
 health:{em:'🩺',name:'สุขภาพ / นัดหมอ',color:'#5FBF8A'},
 birthday:{em:'🎂',name:'วันเกิด / วันสำคัญ',color:'#E8739B'},
 school:{em:'🎒',name:'โรงเรียน / การเรียน',color:'#5B93D6'},
 doc:{em:'📄',name:'เอกสาร / ต่ออายุ',color:'#8C6A4A'},
 money:{em:'💰',name:'ค่าใช้จ่าย / การเงิน',color:'#E89A2B'},
 car:{em:'🚗',name:'รถ / ประกัน',color:'#7A7FD6'},
 home:{em:'🏠',name:'บ้าน / งานบ้าน',color:'#D68A5B'},
 love:{em:'❤️',name:'เรื่องของคนที่เรารัก',color:'#E0553F'},
 other:{em:'📌',name:'อื่น ๆ',color:'#8B7566'},
};
const RELATIONS=['พ่อ','แม่','ลูก','สามี','ภรรยา','ปู่','ย่า','ตา','ยาย','พี่','น้อง','อื่น ๆ'];
const AVATARS=['👨','👩','👦','👧','👴','👵','🧑','👶','🧔','👱‍♀️','🐶','🐱'];
const REPEATS={none:'ไม่ทำซ้ำ',daily:'ทุกวัน',weekly:'ทุกสัปดาห์',monthly:'ทุกเดือน',yearly:'ทุกปี'};
const PRIOS={normal:'ปกติ',high:'สำคัญ',critical:'สำคัญมาก'};

/* ---------- state ---------- */
let S={members:[],items:[],settings:{familyName:'',me:'',pin:'',notify:false,onboarded:false},v:1};
let view='home', selDay=today(), calCursor=new Date(), notified={}, lastView='';

function load(){
 try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);if(d&&d.items)S=Object.assign(S,d);}}
 catch(e){console.warn('load failed',e);}
 if(!S.settings)S.settings={};
}
function save(){
 try{localStorage.setItem(KEY,JSON.stringify(S));}
 catch(e){toast('⚠️','บันทึกไม่สำเร็จ','พื้นที่เก็บข้อมูลอาจเต็ม ลองสำรองข้อมูลแล้วลบรายการเก่า');}
}
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- สถานะกำหนดเวลา ---------- */
function statusOf(it){
 if(it.done)return{k:'done',cls:'p-ok',label:'เสร็จแล้ว',order:9,color:'#5FBF8A'};
 const d=diffDays(it.due);
 if(d===null)return{k:'none',cls:'p-30',label:'ไม่มีกำหนด',order:8,color:'#C9A889'};
 if(d<0)return{k:'over',cls:'p-over',label:`เลยกำหนดแล้ว ${Math.abs(d)} วัน`,order:0,color:'#6D5B4E'};
 if(d===0)return{k:'today',cls:'p-today',label:'ครบกำหนดวันนี้',order:1,color:'#E0553F'};
 if(d===1)return{k:'tmr',cls:'p-tmr',label:'พรุ่งนี้',order:2,color:'#E89A2B'};
 if(d<=7)return{k:'w',cls:'p-7',label:`อีก ${d} วัน`,order:3,color:'#D97B2E'};
 if(d<=30)return{k:'m',cls:'p-30',label:`อีก ${d} วัน`,order:4,color:'#5B93D6'};
 return{k:'far',cls:'p-30',label:`อีก ${d} วัน`,order:5,color:'#A9BED4'};
}

function sortItems(list){
 return [...list].sort((a,b)=>{
  const sa=statusOf(a),sb=statusOf(b);

 });

function birthdayItems(){
 const out=[];
 S.members.forEach(m=>{
  if(!m.birth)return;
  const b=parseD(m.birth), now=new Date();
  let y=now.getFullYear();
  let next=new Date(y,b.getMonth(),b.getDate());
  if(toISO(next)<today())next=new Date(y+1,b.getMonth(),b.getDate());
  const age=next.getFullYear()-b.getFullYear();
  out.push({id:'bd_'+m.id,virtual:true,cat:'birthday',title:`วันเกิด${m.rel?m.rel:''} ${m.name}`,
   note:age>0?`อายุครบ ${age} ปี`:'',due:toISO(next),who:m.id,prio:'high',repeat:'yearly',remind:[7,1],done:false});
 });
 return out;
}
const allItems=()=>[...S.items,...birthdayItems()];

async function askNotify(){
 if(!window.isSecureContext){toast('⚠️','ต้องเปิดผ่าน HTTPS','การแจ้งเตือนจริงต้องใช้เว็บไซต์ HTTPS');return false;}

 if(!('Notification' in window)){toast('ℹ️','เบราว์เซอร์นี้ไม่รองรับ','ลองเปิด Family OS จาก Chrome หรือ Safari รุ่นล่าสุด');return false;}
 try{
  const permission=Notification.permission==='default'?await Notification.requestPermission():Notification.permission;
  if(permission!=='granted'){S.settings.notify=false;save();toast('ℹ️','ยังไม่ได้อนุญาตการแจ้งเตือน','ไปที่การตั้งค่าการแจ้งเตือนของเครื่องแล้วอนุญาต Family OS');return false;}
  const reg=await navigator.serviceWorker.ready;
  const cfg=await fetch('/.netlify/functions/push-config',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject(new Error('push-config')));
  const vapid=base64ToUint8Array(cfg.publicKey);
  let sub=await reg.pushManager.getSubscription();
  if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:vapid});
  const deviceId=getPushDeviceId();
  await fetch('/.netlify/functions/push-subscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({deviceId,subscription:sub.toJSON(),timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'Asia/Bangkok',items:pushItems()})}).then(r=>{if(!r.ok)throw new Error('push-subscribe');return r.json();});
  S.settings.notify=true;S.settings.pushSubscribed=true;save();
  toast('🔔','เปิดการแจ้งเตือนแล้ว','ถึงกำหนดแล้ว แม้ไม่ได้เปิด Family OS ก็แจ้งเตือนได้');
  return true;
 }catch(e){
  console.error(e);
  S.settings.notify=false;S.settings.pushSubscribed=false;save();
  const msg=e?.message==='push-config'?'ยังไม่ได้ตั้งค่า VAPID_PUBLIC_KEY บน Netlify':
   e?.message==='push-subscribe'?'เชื่อมต่อเซิร์ฟเวอร์เก็บ Push ไม่สำเร็จ':(e?.message||'ตรวจการอนุญาตแจ้งเตือนและการตั้งค่า Netlify');
  toast('⚠️','เปิดแจ้งเตือนไม่สำเร็จ',msg);
  return false;
 }
}
function base64ToUint8Array(base64){const pad='='.repeat((4-base64.length%4)%4),b=(base64+pad).replace(/-/g,'+').replace(/_/g,'/');const raw=atob(b);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));}
function getPushDeviceId(){let id=localStorage.getItem(KEY+':push-device');if(!id){id='d_'+uid('');localStorage.setItem(KEY+':push-device',id);}return id;}
function pushItems(){
 return allItems().filter(i=>!i.done&&i.due).map(i=>({
  id:i.id,title:i.title,note:i.note||'',due:i.due,time:i.time||'09:00',
  remind:(i.remind&&i.remind.length)?i.remind:[1,0],repeat:i.repeat||'none',
  em:(CATS[i.cat]||CATS.other).em,virtual:!!i.virtual
 }));
}
function pushPermissionStatus(){
 if(!('Notification' in window))return 'เบราว์เซอร์นี้ไม่รองรับการแจ้งเตือน';
 if(Notification.permission==='granted')return S.settings?.pushSubscribed?'เปิดใช้งานอยู่':'อนุญาตแล้ว แต่ยังไม่ได้เชื่อมต่อ Push';
 if(Notification.permission==='denied')return 'ถูกบล็อก — ต้องอนุญาต Family OS ในการตั้งค่าของเบราว์เซอร์/เครื่อง';
 return 'ยังไม่ได้อนุญาต';
}
let pushSyncTimer=null;
function queuePushSync(){if(!S.settings?.pushSubscribed)return;clearTimeout(pushSyncTimer);pushSyncTimer=setTimeout(()=>syncPushSchedule().catch(()=>{}),500);}
async function syncPushSchedule(){
 if(!S.settings?.pushSubscribed)return;
 const reg=await navigator.serviceWorker.ready, sub=await reg.pushManager.getSubscription();
 if(!sub){S.settings.pushSubscribed=false;save();return;}
 const r=await fetch('/.netlify/functions/push-subscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({deviceId:getPushDeviceId(),subscription:sub.toJSON(),timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'Asia/Bangkok',items:pushItems()})});
 if(!r.ok)throw new Error('push-subscribe '+r.status);
}
async function checkPushServer(){
 try{
  const r=await fetch('/.netlify/functions/push-status',{cache:'no-store'});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){
   /* แสดงสาเหตุจริงที่เซิร์ฟเวอร์ส่งกลับมา จะได้รู้ว่าต้องแก้ตรงไหน */
   const why=d.detail||(d.problems&&d.problems[0])||(d.missing&&d.missing.length?('ยังไม่ได้ตั้งค่า: '+d.missing.join(', ')):'')||d.error||'เซิร์ฟเวอร์ Push ยังตั้งค่าไม่ครบ';
   throw new Error(why);
  }
  return true;
 }catch(e){
  toast('⚠️','ระบบ Push ยังไม่พร้อม',(e&&e.message)||'ตรวจ Environment Variables บน Netlify',12000);
  return false;
 }
}
async function testPush(){

 }

 }catch(e){console.error(e);toast('⚠️','ทดสอบ Push ไม่สำเร็จ',e.message||'ตรวจ VAPID และ Netlify Functions');}

function fireNotify(em,title,body){
 toast(em,title,body);
 try{if(S.settings.notify&&'Notification' in window&&Notification.permission==='granted')new Notification(title,{body,icon:'icon-192.png',badge:'icon-192.png'});}catch(e){}
}
function checkReminders(){
 const list=allItems().filter(i=>!i.done&&i.due);
 let fired=0;
 list.forEach(it=>{
  const d=diffDays(it.due);
  const remind=(it.remind&&it.remind.length)?it.remind:[1];
  const hit = d<0 ? 'over' : (d===0?'today':(remind.includes(d)?'pre':null));
  if(!hit)return;
  const stamp=`${it.id}|${today()}|${hit}`;
  if(notified[stamp])return;
  notified[stamp]=1;
  if(fired>=3)return;
  fired++;
  const c=CATS[it.cat]||CATS.other;
  if(hit==='over')fireNotify('⚫','เลยกำหนดแล้ว '+Math.abs(d)+' วัน',`${c.em} ${it.title}`);
  else if(hit==='today')fireNotify('🔴','ครบกำหนดวันนี้',`${c.em} ${it.title}`);
  else fireNotify('🔔',`ใกล้ครบกำหนดในอีก ${d} วัน`,`${c.em} ${it.title}`);
 });
 try{localStorage.setItem(KEY+':notified',JSON.stringify(notified));}catch(e){}
}

function nextDue(iso,rep){
 const d=parseD(iso), day=d.getDate();
 if(rep==='daily'){d.setDate(d.getDate()+1);return toISO(d);}
 if(rep==='weekly'){d.setDate(d.getDate()+7);return toISO(d);}
 if(rep==='monthly'||rep==='yearly'){
  // ต้องกันวันล้นเดือน เช่น 31 ม.ค. + 1 เดือน ต้องได้ 28/29 ก.พ. ไม่ใช่ 3 มี.ค.
  const y=rep==='yearly'?d.getFullYear()+1:d.getFullYear();
  const mo=rep==='yearly'?d.getMonth():d.getMonth()+1;
  const t=new Date(y,mo,1);
  const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
  t.setDate(Math.min(day,last));
  return toISO(t);
 }
 return iso;
}
function toggleDone(id){
 const it=S.items.find(x=>x.id===id);
 if(!it)return;
 if(!it.done&&it.repeat&&it.repeat!=='none'&&it.due){
  const nd=nextDue(it.due,it.repeat);
  it.due=nd;it.done=false;
  save();render();
  toast('🔁','ทำเสร็จแล้ว เลื่อนไปครั้งถัดไป',`ครั้งต่อไป ${fmtD(nd)}`);
  return;
 }
 it.done=!it.done;
 it.completedAt=it.done?today():'';
 save();render();
 if(it.done)toast('🎉','เยี่ยมมาก ทำเสร็จแล้ว',it.title);
}

function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function bindItems(root){
 $$('.item',root).forEach(el=>{
  el.onclick=e=>{
   if(e.target.closest('[data-chk]'))return;
   const id=el.dataset.id;
   if(id.startsWith('bd_')){
    const m=memberOf(id.slice(3));
    if(m)memberForm(m);
    return;
   }
   const it=S.items.find(x=>x.id===id);
   if(it)itemForm(it);
  };
 });
 $$('[data-chk]',root).forEach(b=>b.onclick=e=>{e.stopPropagation();toggleDone(b.dataset.chk);});
}

/* ══════════ ส่งออกปฏิทิน .ics ══════════ */
function exportICS(){
 const items=allItems().filter(i=>!i.done&&i.due);
 if(!items.length){toast('ℹ️','ยังไม่มีรายการที่มีวันครบกำหนด','');return;}
 const esc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
 const stamp=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
 let out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//FamilyOS//TH','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
 items.forEach(it=>{
  const d=it.due.replace(/-/g,'');
  const c=CATS[it.cat]||CATS.other;
  const rem=(it.remind&&it.remind.length)?it.remind:[1];
  out.push('BEGIN:VEVENT',`UID:${it.id}@familyos`,`DTSTAMP:${stamp}`);
  if(it.time){
   const t=it.time.replace(':','')+'00';
   out.push(`DTSTART;TZID=Asia/Bangkok:${d}T${t}`);
  } else {
   const nd=parseD(it.due);nd.setDate(nd.getDate()+1);
   out.push(`DTSTART;VALUE=DATE:${d}`,`DTEND;VALUE=DATE:${toISO(nd).replace(/-/g,'')}`);
  }
  out.push(`SUMMARY:${esc(c.em+' '+it.title)}`);
  const who=memberOf(it.who);
  out.push(`DESCRIPTION:${esc([it.note,who?'ผู้ดูแล: '+who.name:'',it.amount?'จำนวนเงิน: '+money(it.amount)+' บาท':''].filter(Boolean).join('\n'))}`);
  if(it.repeat&&it.repeat!=='none'){
   const F={daily:'DAILY',weekly:'WEEKLY',monthly:'MONTHLY',yearly:'YEARLY'}[it.repeat];
   out.push(`RRULE:FREQ=${F}`);
  }
  rem.forEach(r=>out.push('BEGIN:VALARM',`TRIGGER:-P${r}D`,'ACTION:DISPLAY',`DESCRIPTION:${esc(it.title)}`,'END:VALARM'));
  out.push('END:VEVENT');
 });
 out.push('END:VCALENDAR');
 dl(new Blob([out.join('\r\n')],{type:'text/calendar;charset=utf-8'}),'family-os.ics');
 toast('📅','สร้างไฟล์ปฏิทินแล้ว','เปิดไฟล์นี้ในมือถือเพื่อเพิ่มเข้าปฏิทิน แล้วปฏิทินจะเตือนคุณเอง');
}
function dl(blob,name){
 const u=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(u),5000);
}

function pinPad(title,onDone){
 let buf='';
 const root=$('#lockRoot');
 const draw=()=>{$$('.pindot',root).forEach((d,i)=>d.classList.toggle('on',i<buf.length));};
 root.innerHTML=`<div class="lock">
  <img src="icon-192.png" alt="">
  <div class="mitr" style="font-size:18px">${title}</div>
  <div class="pinrow">${[0,1,2,3].map(()=>'<span class="pindot"></span>').join('')}</div>
  <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" data-k="${n}">${n}</button>`).join('')}
   <button class="key" data-k="c">⌫</button><button class="key" data-k="0">0</button><span></span></div>
 </div>`;
 $$('.key',root).forEach(b=>b.onclick=()=>{
  const k=b.dataset.k;
  if(k==='c')buf=buf.slice(0,-1);
  else if(buf.length<4)buf+=k;
  draw();
  if(buf.length===4)setTimeout(()=>onDone(buf,()=>{buf='';draw();}),140);
 });
}

 $$('[data-nav]').forEach(b=>b.onclick=()=>{view=b.dataset.nav;render();});
 $$('[data-add]').forEach(b=>b.onclick=()=>itemForm(null,{cat:b.dataset.add,flow:b.dataset.add==='money'?'out':'out'}));
 $$('[data-mem]').forEach(b=>b.onclick=()=>{const m=memberOf(b.dataset.mem);if(m)memberForm(m);});
 $$('[data-edit]').forEach(b=>b.onclick=()=>{const m=memberOf(b.dataset.edit);if(m)memberForm(m);});
 $$('[data-go]').forEach(b=>b.onclick=()=>{view='list';listFilter=b.dataset.go;render();});
 $$('[data-f]').forEach(b=>b.onclick=()=>{listFilter=b.dataset.f;render();});
 const ed=$('#emptyDemo');if(ed)ed.onclick=loadDemo;
 const em=$('#emptyMem');if(em)em.onclick=()=>memberForm(null);
 ['addMem','addMem2','addMem3','qMem'].forEach(id=>{const e=$('#'+id);if(e)e.onclick=()=>memberForm(null);});
 ['qCard','emCard'].forEach(id=>{const e=$('#'+id);if(e)e.onclick=emergencyCard;});
 bindItems($('#main'));

 const bell=$('#btnBell');
 if(bell)bell.onclick=()=>{
  const act=allItems().filter(i=>!i.done&&i.due);
  const urgent=sortItems(act).filter(i=>['over','today','tmr','w'].includes(statusOf(i).k)).slice(0,6);
  openSheet(`<h3>🔔 การแจ้งเตือน</h3><p class="sub">เรื่องที่ควรจัดการก่อน</p>
   <div class="itemlist">${urgent.length?urgent.map(itemRow).join(''):'<div class="card empty"><span class="em">🌿</span>ตอนนี้ยังไม่มีอะไรเร่งด่วน</div>'}</div>
   <button class="btn ghost sm" id="nClose" style="margin-top:13px">ปิด</button>`,()=>{
   $('#nClose').onclick=closeSheet;bindItems($('#sht'));
  });
 };

 if(view==='calendar'){
  $('#pm').onclick=()=>{calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()-1,1);render();};
  $('#nm').onclick=()=>{calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()+1,1);render();};
  $$('[data-day]').forEach(b=>b.onclick=()=>{selDay=b.dataset.day;render();});
  $('#addOnDay').onclick=()=>itemForm(null,{due:selDay});
 }

 if(view==='settings'){
  $('#s_save').onclick=()=>{S.settings.familyName=$('#s_fam').value.trim();S.settings.me=$('#s_me').value.trim();
   save();render();toast('✅','บันทึกแล้ว','');};
  $('#s_notify').onclick=async()=>{const ok=await askNotify();if(ok)render();};
  $('#s_testpush').onclick=testPush;
  $('#s_pushstatus').onclick=async()=>{if(await checkPushServer())toast('✅','ระบบ Push พร้อมใช้งาน','VAPID และ Netlify Function ผ่านแล้ว');};
  $('#s_demo').onclick=()=>confirmBox('ใส่ข้อมูลตัวอย่าง?','ข้อมูลปัจจุบันจะถูกแทนที่ทั้งหมด ควรกดบันทึกไฟล์สำรองก่อนถ้ามีข้อมูลจริงอยู่แล้ว',loadDemo,'ใส่ตัวอย่าง');
  $('#s_ics').onclick=exportICS;
  $('#s_export').onclick=()=>{
   dl(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),`familyos-backup-${today()}.json`);
   toast('💾','บันทึกไฟล์สำรองแล้ว','เก็บไฟล์นี้ไว้ในคลาวด์หรือส่งเข้าไลน์ตัวเอง');
  };
  $('#s_import').onclick=()=>$('#s_file').click();
  $('#s_file').onchange=async e=>{
   const f=e.target.files[0];if(!f)return;
   try{
    const d=JSON.parse(await f.text());
    if(!d||!Array.isArray(d.items))throw new Error('ไฟล์ไม่ถูกต้อง');
    confirmBox('กู้คืนข้อมูล?','ข้อมูลปัจจุบันจะถูกแทนที่ทั้งหมด',()=>{
     S=Object.assign({members:[],items:[],settings:{}},d);save();render();
     toast('✅','กู้คืนข้อมูลเรียบร้อย',`${S.items.length} รายการ · ${S.members.length} สมาชิก`);
    },'กู้คืน');
   }catch(err){toast('❌','ไฟล์นี้ใช้ไม่ได้',err.message||'');}
   e.target.value='';
  };
  $('#s_pin').onclick=()=>{
   pinPad('ตั้งรหัส 4 หลัก',(v1,reset1)=>{
    $('#lockRoot').innerHTML='';
    pinPad('ใส่รหัสเดิมอีกครั้ง',(v2)=>{
     $('#lockRoot').innerHTML='';
     if(v1===v2){S.settings.pin=v1;save();render();toast('🔒','ตั้งรหัสเรียบร้อย','ครั้งต่อไปต้องใส่รหัสก่อนเข้าใช้');}
     else toast('❌','รหัสไม่ตรงกัน','ลองใหม่อีกครั้ง');
    });
   });
  };
  const po=$('#s_pinoff');
  if(po)po.onclick=()=>confirmBox('ปิดการล็อก?','ใครก็ตามที่ถือเครื่องนี้จะเปิดดูข้อมูลได้',()=>{
   S.settings.pin='';save();render();toast('🔓','ปิดการล็อกแล้ว','');},'ปิดการล็อก');
  $('#s_wipe').onclick=()=>confirmBox('ล้างข้อมูลทั้งหมด?','ทุกรายการและสมาชิกจะหายไป กู้คืนไม่ได้ ควรบันทึกไฟล์สำรองก่อน',()=>{
   S={members:[],items:[],settings:{familyName:'',me:'',pin:'',notify:false,onboarded:true,demo:false},v:1};
   save();render();toast('🗑️','ล้างข้อมูลแล้ว','');},'ล้างทั้งหมด');
 }
}

/* ══════════ เริ่มทำงาน ══════════ */
load();
if(location.hash==='#settings')view='settings';
try{notified=JSON.parse(localStorage.getItem(KEY+':notified')||'{}');}catch(e){notified={};}
$('#fab').onclick=()=>itemForm(null,view==='calendar'?{due:selDay}:null);
render();
if(S.settings.pin)lockScreen();
if(!S.settings.onboarded)setTimeout(onboard,350);
setTimeout(checkReminders,1400);
setInterval(checkReminders,1000*60*30);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(checkReminders,600);});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
// เปิดจากเบราว์เซอร์ (ยังไม่ได้ติดตั้ง) -> ชวนติดตั้งเพื่อให้ดูเป็นแอปจริง
if(!isStandalone()){
 const bar=$('#installBar');
 if(bar){
  bar.style.display='flex';
  const b=$('#installBtn');
  if(b)b.onclick=async()=>{
   if(deferred){deferred.prompt();try{await deferred.userChoice;}catch(e){} deferred=null;bar.style.display='none';}
   else showInstallHelp();
  };
 }
}
</script>
</body>
